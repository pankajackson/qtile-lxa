[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtile-lxa"
version = "x.x.x"
authors = [
    { name = "Pankaj Jackson", email = "pankajackson@live.co.uk" }
]
description = "QtileLXA is a modular extension suite for the Qtile window manager, featuring custom widgets, dynamic theming, video wallpapers, and system controls, all designed to enhance and automate your Qtile desktop experience."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"

dependencies = [
    "qtile",
    "qtile-extras",
    "elasticsearch",
    "kubernetes",
    "GPUtil",
    "pywal",
    "psutil",
    "docker",
    "podman",
    "jinja2"
]

keywords = [
    "qtile",
    "widgets",
    "feature",
    "wm",
    "window manager"
]

classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Topic :: Desktop Environment :: Window Managers",
]

[project.urls]
Homepage = "https://github.com/pankajackson/qtile-lxa"
"Bug Tracker" = "https://github.com/pankajackson/qtile-lxa/issues"
Source = "https://github.com/pankajackson/qtile-lxa"

[tool.setuptools.package-data]
qtile_lxa = ["assets/**/*"]
